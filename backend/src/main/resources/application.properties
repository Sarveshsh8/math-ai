server.port=8080

# MongoDB
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/mathai}

# JWT
mathai.jwt.secret=${JWT_SECRET:change-this-to-a-256-bit-secret-in-production}
mathai.jwt.expiration-ms=86400000

# AI service (Python FastAPI)
mathai.ai.base-url=${AI_BASE_URL:http://localhost:8000}

# CORS — allow frontend dev server
mathai.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175}

# Disable Spring Boot banner noise in logs
logging.level.org.springframework.security=WARN
